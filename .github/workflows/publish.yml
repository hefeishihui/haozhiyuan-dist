name: Publish ipa
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download latest ipa artifact
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --repo hefeishihui/haozhiyuan-ios --workflow ios-adhoc.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run=$RUN_ID"
          gh run download "$RUN_ID" --repo hefeishihui/haozhiyuan-ios -n haozhiyuan-ipa -D out
          ls -lh out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          set -euo pipefail
          gh release create v1.3.0 --repo hefeishihui/haozhiyuan-dist --title "好志愿 v1.3.0" --notes "Ad Hoc 安装包（iPad UDID 已登记）" 2>/dev/null || true
          gh release upload v1.3.0 out/HaoZhiyuan.ipa --repo hefeishihui/haozhiyuan-dist --clobber
          gh release view v1.3.0 --repo hefeishihui/haozhiyuan-dist --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
